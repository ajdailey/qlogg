name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and every test on each target's native runner. Linux runs the SWT
  # tests under Xvfb; Windows and macOS run them on the runner desktop.
  test:
    name: test ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, runner: ubuntu-24.04 }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm }
          - { target: windows-x86_64, runner: windows-2025 }
          - { target: windows-aarch64, runner: windows-11-arm }
          - { target: macos-x86_64, runner: macos-15-intel }
          - { target: macos-aarch64, runner: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21.0.12+8"
          cache: maven
      - name: Xvfb and GTK 3
        if: runner.os == 'Linux'
        run: .github/scripts/linux-display-deps.sh
      # The host bundle's JDK goes outside ~/.m2, so the Maven cache holds
      # no JDK archive.
      - name: Verify (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./mvnw -B verify "-Dqlogg.cache.dir=$RUNNER_TEMP/qlogg-cache"
      - name: Verify (macOS)
        if: runner.os == 'macOS'
        run: ./mvnw -B verify
      - name: Verify (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: mvnw.cmd -B verify

  # The SWT tests on the experimental GTK 4 backend. Tests that hit a known
  # GTK 4 defect skip themselves under SWT_GTK4=1 (ui-swt test class Gtk4).
  test-gtk4:
    name: test linux-x86_64 GTK 4 (experimental)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SWT_GTK4: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21.0.12+8"
          cache: maven
      - name: Xvfb and GTK 3
        run: .github/scripts/linux-display-deps.sh
      - name: GTK 4
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-1
      - name: Verify the SWT modules
        run: xvfb-run -a ./mvnw -B verify -pl qlogg-ui-swt,qlogg-launcher -am

  # The seven archives and the SBOM; qlogg-dist builds the archives on x86-64
  # Linux only. The JDK archives and rcodesign have their own cache, keyed on
  # dist.xml, which pins them.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21.0.12+8"
          cache: maven
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/qlogg
          key: qlogg-dist-${{ hashFiles('qlogg-dist/src/build/dist.xml') }}
      - run: ./mvnw -B package -Pall-targets,sbom -DskipTests "-Dqlogg.cache.dir=$HOME/.cache/qlogg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qlogg-archives
          path: dist/
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}

  # Each bundle on its own target: the runtime reports the target's os.arch,
  # and the bundle's launcher opens the main window with that runtime. The
  # universal zip, which has no runtime, then starts with setup-java's JDK.
  bundle:
    name: bundle ${{ matrix.target }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, runner: ubuntu-24.04, arch: amd64 }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm, arch: aarch64 }
          - { target: windows-x86_64, runner: windows-2025, arch: amd64, machine: x64 }
          - { target: windows-aarch64, runner: windows-11-arm, arch: aarch64, machine: ARM64 }
          - { target: macos-x86_64, runner: macos-15-intel, arch: x86_64 }
          - { target: macos-aarch64, runner: macos-15, arch: aarch64 }
    env:
      TARGET: ${{ matrix.target }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qlogg-archives
          path: dist
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21.0.12+8"
      - name: Xvfb and GTK 3
        if: runner.os == 'Linux'
        run: .github/scripts/linux-display-deps.sh
      - name: Run the bundle (Linux, macOS)
        if: runner.os != 'Windows'
        run: .github/scripts/check-bundle.sh
      - name: Run the bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/check-bundle.ps1

  # A v* tag: rebuild twice to check reproducibility, check that the rebuild
  # matches the archives the bundle jobs ran, and attach those archives,
  # SHA256SUMS and the SBOM to a draft GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21.0.12+8"
          cache: maven
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/qlogg
          key: qlogg-dist-${{ hashFiles('qlogg-dist/src/build/dist.xml') }}
      - name: Reproducibility
        run: .github/scripts/check-reproducible.sh "-Dqlogg.cache.dir=$HOME/.cache/qlogg"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qlogg-archives
          path: release
      - name: SHA256SUMS
        run: |
          cd release
          sha256sum -- *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 7
          cd ../dist/reproducible/dist1
          sha256sum -c ../../../release/SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "$GITHUB_REF_NAME" --generate-notes
