name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and every test on each target's native runner. Linux runs the SWT
  # tests under Xvfb; Windows and macOS run them on the runner desktop.
  test:
    name: test ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, runner: ubuntu-24.04 }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm }
          - { target: windows-x86_64, runner: windows-2025 }
          - { target: windows-aarch64, runner: windows-11-arm }
          - { target: macos-x86_64, runner: macos-15-intel }
          - { target: macos-aarch64, runner: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Xvfb and GTK 3
        if: runner.os == 'Linux'
        run: .github/scripts/linux-display-deps.sh
      - name: Verify (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./mvnw -B verify
      - name: Verify (macOS)
        if: runner.os == 'macOS'
        run: ./mvnw -B verify
      - name: Verify (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: mvnw.cmd -B verify

  # The SWT tests on the experimental GTK 4 backend. Not gating: it shows
  # when the SWT GTK 4 defects that affect the log view are fixed.
  test-gtk4:
    name: test linux-x86_64 GTK 4 (experimental)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    env:
      SWT_GTK4: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Xvfb and GTK 3
        run: .github/scripts/linux-display-deps.sh
      - name: GTK 4
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-1
      - name: Verify the SWT modules
        run: xvfb-run -a ./mvnw -B verify -pl qlogg-ui-swt,qlogg-launcher -am

  # The seven archives; qlogg-dist builds them on x86-64 Linux only.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B package -Pall-targets -DskipTests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qlogg-archives
          path: dist/
          if-no-files-found: error

  # Each bundle on its own target: the runtime reports the target's os.arch,
  # and the bundle's launcher opens the main window with that runtime.
  bundle:
    name: bundle ${{ matrix.target }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, runner: ubuntu-24.04, arch: amd64 }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm, arch: aarch64 }
          - { target: windows-x86_64, runner: windows-2025, arch: amd64, machine: x64 }
          - { target: windows-aarch64, runner: windows-11-arm, arch: aarch64, machine: ARM64 }
          - { target: macos-x86_64, runner: macos-15-intel, arch: x86_64 }
          - { target: macos-aarch64, runner: macos-15, arch: aarch64 }
    env:
      TARGET: ${{ matrix.target }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qlogg-archives
          path: dist
      - name: Xvfb and GTK 3
        if: runner.os == 'Linux'
        run: .github/scripts/linux-display-deps.sh
      - name: Run the bundle (Linux, macOS)
        if: runner.os != 'Windows'
        run: .github/scripts/check-bundle.sh
      - name: Run the bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/check-bundle.ps1
