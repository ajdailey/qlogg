name: apple-hr probe

on:
  push:
    branches: [probe/apple-hr]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sign:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qlogg-archives
          path: dist
          run-id: 45860572689
          github-token: ${{ github.token }}
      - run: .github/scripts/apple-hr-sign.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: variants
          path: variants/
          retention-days: 7

  run:
    name: run ${{ matrix.target }}
    needs: sign
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-x86_64, runner: macos-15-intel }
          - { target: macos-aarch64, runner: macos-15 }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: variants
          path: variants
      - run: sw_vers
      - run: .github/scripts/apple-hr-run.sh
      - run: .github/scripts/apple-hr-controls.sh
