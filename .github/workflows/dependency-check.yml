name: Dependency check

# Known-vulnerability scan of the Maven dependencies, weekly and on demand.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21.0.12+8"
          cache: maven
      # NVD_API_KEY is an optional repository secret; without it the NVD
      # download is rate-limited and slow.
      - name: Scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          ./mvnw -B -DskipTests -pl !qlogg-dist install
          org.owasp:dependency-check-maven:13.0.0:aggregate
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -DfailBuildOnCVSS=7
          -DsuppressionFile=config/dependency-check-suppressions.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore
